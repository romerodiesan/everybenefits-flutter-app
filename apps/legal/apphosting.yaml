# Firebase App Hosting — Legal Center
# Project: every-benefits-us
#
# Console / GitHub backend settings:
#   Root directory = apps/legal  (must match firebase.json apphosting.rootDir)
#
# Prefer Firebase Hosting for this static site (`pnpm deploy:legal`).
# App Hosting works via a small static file server over the prerendered build.
#
# Do NOT set scripts.buildCommand here. The Node buildpack rewrites
# package.json when buildCommand is set, and its Go struct serializes missing
# `dependencies` as null — pnpm 11 then fails with
# ERR_PNPM_INVALID_DEPENDENCIES_FIELD. Use package.json#apphosting:build /
# start instead (same workaround as GoogleCloudPlatform/buildpacks#621).
#
# Important: Console overrideEnv PUBLIC_PULSE_WEB_URL must be the Pulse web
# origin (https://pulse.everybenefits.us), not the legal site hostname.

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 5
  concurrency: 80

env:
  - variable: PUBLIC_PULSE_WEB_URL
    value: https://pulse.everybenefits.us
    availability:
      - BUILD
      - RUNTIME
