packages:
  - "apps/*"
  - "packages/*"
  - "test/rules"

strictDepBuilds: false
confirmModulesPurge: false

allowBuilds:
  "@firebase/util": true
  "@parcel/watcher": true
  "@swc/core": true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  esbuild: true

# Security patches for transitive deps (Next pins old postcss; firebase-admin pins uuid@9)
overrides:
  postcss: ">=8.5.18"
  uuid: ">=11.1.1"
  sharp: ">=0.35.0"
